name: Production CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-readiness:
    name: Production readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production readiness audit
        run: pnpm run audit:production

      - name: Sensitive writes audit
        run: pnpm run audit:sensitive

      - name: SEO and PWA audit
        run: pnpm run audit:seo-pwa

      - name: Asset health audit
        run: pnpm run audit:assets

      - name: Public routes audit
        run: pnpm run audit:routes

      - name: Admin command center audit
        run: pnpm run audit:admin

      - name: Ride lifecycle audit
        run: pnpm run audit:ride-lifecycle

      - name: Cancellation and refund audit
        run: pnpm run audit:cancellations

      - name: Ride state transitions audit
        run: pnpm run audit:ride-states

      - name: Post-ride audit
        run: pnpm run audit:post-ride

      - name: Ride chat and notifications audit
        run: pnpm run audit:ride-chat

      - name: Build application
        run: pnpm run build

      - name: Run unit tests
        run: pnpm test

      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-production-ci
          path: .artifacts/vitest-report.json
          if-no-files-found: warn
          retention-days: 7
