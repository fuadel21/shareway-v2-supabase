name: ShareWay CI/CD Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.TEST_SUPABASE_URL }}" ]; then echo "❌ Missing TEST_SUPABASE_URL"; exit 1; fi
          if [ -z "${{ secrets.TEST_SUPABASE_ANON_KEY }}" ]; then echo "❌ Missing TEST_SUPABASE_ANON_KEY"; exit 1; fi
          echo "✅ All secrets are present"

      - name: Create .env.test
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.TEST_SUPABASE_URL }}" > .env.test
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.TEST_SUPABASE_ANON_KEY }}" >> .env.test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Tests
        run: pnpm test
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          NODE_ENV: test
