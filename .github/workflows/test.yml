
name: ShareWay CI/CD Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Hemos quitado la línea de caché para evitar el error del lock file

      - name: Install dependencies
        run: npm install --no-package-lock # Instalación limpia sin exigir lock file

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.TEST_SUPABASE_URL }}" ]; then echo "❌ Missing TEST_SUPABASE_URL"; exit 1; fi
          if [ -z "${{ secrets.TEST_SUPABASE_ANON_KEY }}" ]; then echo "❌ Missing TEST_SUPABASE_ANON_KEY"; exit 1; fi
          if [ -z "${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}" ]; then echo "❌ Missing TEST_SUPABASE_SERVICE_ROLE_KEY"; exit 1; fi
          echo "✅ All secrets are present"

      - name: Create .env.test
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.TEST_SUPABASE_URL }}" > .env.test
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.TEST_SUPABASE_ANON_KEY }}" >> .env.test
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}" >> .env.test
          echo "VITE_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}" >> .env.test

      - name: Provision Test Data
        run: node scripts/seed-test.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: |
          # Arrancamos la app y esperamos a que el puerto responda
          npx vite & 
          npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          NODE_ENV: test
