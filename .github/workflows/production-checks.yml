name: Production checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - audit/production-readiness-20260707

jobs:
  production-checks:
    name: Audit and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production audit
        run: pnpm run audit:production

      - name: Run sensitive write audit
        run: pnpm run audit:sensitive

      - name: Build
        run: pnpm run build
