<svg width="720" height="200" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2A86"/>
      <stop offset="55%" stop-color="#1267FF"/>
      <stop offset="100%" stop-color="#0FC6A6"/>
    </linearGradient>
    <linearGradient id="way" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1267FF"/>
      <stop offset="100%" stop-color="#0FC6A6"/>
    </linearGradient>
  </defs>

  <!-- Marca: ruta A→B en squircle -->
  <g transform="translate(10,20)">
    <rect x="0" y="0" width="160" height="160" rx="38" fill="url(#brand)"/>
    <circle cx="128" cy="26" r="4" fill="#ffffff" opacity="0.35"/>
    <path d="M 42 118 C 70 95 65 73 87 65 C 109 57 110 44 121 40"
          fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
    <path d="M 42 118 C 70 95 65 73 87 65 C 109 57 110 44 121 40"
          fill="none" stroke="#0FC6A6" stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="1 8" opacity="0.85"/>
    <circle cx="42" cy="118" r="10.5" fill="#ffffff"/>
    <circle cx="42" cy="118" r="4.5" fill="url(#way)"/>
    <path d="M 121 40 c -7 -9.5 -10 -14 -10 -19.5 a 10 10 0 1 1 20 0 c 0 5.5 -3 10 -10 19.5 z"
          fill="#ffffff"/>
    <circle cx="121" cy="20" r="5" fill="url(#way)"/>
  </g>

  <!-- Wordmark -->
  <text x="196" y="128" font-family="Outfit, 'Segoe UI', Arial, sans-serif"
        font-size="86" font-weight="900" font-style="italic" letter-spacing="-3">
    <tspan fill="#0B2A86">share</tspan><tspan fill="url(#way)">way</tspan>
  </text>

  <!-- Tagline -->
  <text x="200" y="164" font-family="Outfit, 'Segoe UI', Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing="7" fill="#1267FF" opacity="0.75">
    COMPARTE · CONECTA · VIAJA
  </text>
</svg>
